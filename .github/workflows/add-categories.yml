name: Implementar categorias de questões

on:
  push:
    branches:
      - feature/categorias-questoes
    paths:
      - .github/workflows/add-categories.yml

permissions:
  contents: write

jobs:
  implementar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: feature/categorias-questoes
          fetch-depth: 0

      - name: Aplicar alterações isoladas no index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Falha em {label}: esperado 1 trecho, encontrado {count}.")
              text = text.replace(old, new, 1)

          css = r'''
    .category-filter {
      flex: 1 1 190px;
      min-width: 170px;
    }

    .category-pill {
      color: #5b45b5;
      border: 1px solid #ddd6fe;
      background: #f3f0ff;
    }

    .category-manager-list {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .category-manager-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f8faff;
    }

    .category-manager-row small {
      color: var(--muted);
      white-space: nowrap;
    }

    .category-delete-check {
      display: inline-flex;
      grid-template-columns: none;
      align-items: center;
      gap: 6px;
      color: var(--danger);
      font-size: 13px;
      white-space: nowrap;
    }

    .category-delete-check input {
      width: auto;
      margin: 0;
    }

    .category-manager-empty {
      margin: 0;
      padding: 12px;
      border-radius: 9px;
      color: var(--muted);
      background: #f6f8fc;
    }

    @media (max-width: 700px) {
      .category-manager-row {
        grid-template-columns: 1fr;
      }

      .category-manager-row small,
      .category-delete-check {
        white-space: normal;
      }
    }
'''
          replace_once("  </style>", css + "  </style>", "inserção do CSS de categorias")

          status_filter = '''              <label class="select-with-icon">
                <svg class="filter-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16l-6 7v4l-4 2v-6z"></path>
                </svg>
                <select id="cardFilter" aria-label="Filtrar questões">
                  <option value="all">Todos ativos</option>
                  <option value="new">Não estudados</option>
                  <option value="learning">Em andamento</option>
                  <option value="mastered">Dominados</option>
                  <option value="frozen">Congelados</option>
                </select>
              </label>'''
          category_filter = status_filter + '''
              <label class="select-with-icon category-filter">
                <svg class="filter-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h10l6 6-7 7-9-9z"></path>
                  <circle cx="9" cy="10" r="1"></circle>
                </svg>
                <select id="cardCategoryFilter" aria-label="Filtrar por categoria">
                  <option value="all">Todas as categorias</option>
                </select>
