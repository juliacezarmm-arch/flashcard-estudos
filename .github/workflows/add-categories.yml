              '      questionCollection: document.querySelector("#questionCollection"),\n      questionCategory: document.querySelector("#questionCategory"),',
              "referência do campo de categoria"
          )
          replace_once(
              '      cardFilter: document.querySelector("#cardFilter"),',
              '      cardFilter: document.querySelector("#cardFilter"),\n      cardCategoryFilter: document.querySelector("#cardCategoryFilter"),',
              "referência do filtro de categoria"
