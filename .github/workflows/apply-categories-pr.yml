name: Aplicar categorias na branch de teste

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  aplicar-categorias:
    if: github.head_ref == 'feature/categorias-questoes'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositório
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch feature/categorias-questoes https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Aplicar e validar categorias
        shell: bash
        run: |
          cd repo
          if grep -q 'id="cardCategoryFilter"' index.html; then
            echo "Categorias já aplicadas."
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/add-categories.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_categories.py').write_text('\n'.join(lines), encoding='utf-8')
          PY
          python /tmp/apply_categories.py
          git diff --check
          python <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value: self.ids.append(value)
          parser=Parser(); parser.feed(text)
          duplicates=sorted({x for x in parser.ids if parser.ids.count(x)>1})
          if duplicates: raise SystemExit(f'IDs duplicados: {duplicates}')
          required=['id="cardCategoryFilter"','id="questionCategory"','function openManageCategoriesModal','data-subject-action="categories"','base.categoria = card.category']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Trechos ausentes: {missing}')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/fixa-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'HTML validado com {len(parser.ids)} IDs únicos.')
          PY
          node --check /tmp/fixa-inline.js

      - name: Salvar na branch de teste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git add index.html
          git commit -m "Adiciona categorias às questões"
          git push origin HEAD:feature/categorias-questoes
