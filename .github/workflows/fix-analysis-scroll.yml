name: Ajustar rolagem na análise

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-analysis-scroll.yml

permissions:
  contents: write

jobs:
  ajustar-rolagem:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adicionar rolagem interna
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          marker = "/* FIXA: rolagem interna dos status da análise */"
          if marker not in content:
              css = r'''

    /* FIXA: rolagem interna dos status da análise */
    #analysisCritical,
    #analysisNearMastered {
      min-height: 0;
      max-height: 198px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 6px;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: #b8c1d1 transparent;
    }

    #analysisCritical::-webkit-scrollbar,
    #analysisNearMastered::-webkit-scrollbar {
      width: 7px;
    }

    #analysisCritical::-webkit-scrollbar-thumb,
    #analysisNearMastered::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #b8c1d1;
    }

    #analysisCritical::-webkit-scrollbar-track,
    #analysisNearMastered::-webkit-scrollbar-track {
      background: transparent;
    }
'''
              closing_style = "</style>"
              if closing_style not in content:
                  raise SystemExit("A tag </style> não foi encontrada.")
              content = content.replace(closing_style, css + "\n  " + closing_style, 1)

          if 'id="analysisCritical"' not in content:
              raise SystemExit("O elemento #analysisCritical não foi encontrado.")
          if 'id="analysisNearMastered"' not in content:
              raise SystemExit("O elemento #analysisNearMastered não foi encontrado.")

          path.write_text(content, encoding="utf-8")
          PY

      - name: Validar alteração
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          content = Path("index.html").read_text(encoding="utf-8")
          assert "/* FIXA: rolagem interna dos status da análise */" in content
          assert "#analysisCritical" in content
          assert "#analysisNearMastered" in content
          assert "overflow-y: auto" in content
          print("Alteração validada.")
          PY

      - name: Salvar alteração e remover fluxo temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-analysis-scroll.yml
          git commit -m "Adiciona rolagem interna aos status da análise"
          git push
