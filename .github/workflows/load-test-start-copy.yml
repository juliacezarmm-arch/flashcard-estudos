name: Carregar correção do texto do teste

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/load-test-start-copy.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar index.html
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_version = '20260731-sidebar-footer-1'
          new_version = '20260731-test-start-copy-1'
          text = text.replace(old_version, new_version)

          anchor = '''      fetch("sidebar-footer-polish.js?v=20260731-test-start-copy-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o acabamento do rodapé lateral.");
        return response.text();
      })'''
          replacement = '''      fetch("sidebar-footer-polish.js?v=20260731-test-start-copy-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o acabamento do rodapé lateral.");
        return response.text();
      }),
      fetch("test-start-copy.js?v=20260731-test-start-copy-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a correção do texto do teste.");
        return response.text();
      })'''
          if anchor not in text:
              raise SystemExit('Bloco de carregamento não encontrado.')
          text = text.replace(anchor, replacement, 1)

          old_then = '.then(([html, categoryCode, categoryManagerCode, compactQuestionsCode, importReviewCode, categoryModalCloseFixCode, importReviewCompactCode, collectionOrderManagerCode, importReviewReplaceExactCode, analysisCompactCode, analysisPercentAlignmentCode, topbarCompactCode, topbarAnalysisCode, sidebarFooterPolishCode]) => {'
          new_then = '.then(([html, categoryCode, categoryManagerCode, compactQuestionsCode, importReviewCode, categoryModalCloseFixCode, importReviewCompactCode, collectionOrderManagerCode, importReviewReplaceExactCode, analysisCompactCode, analysisPercentAlignmentCode, topbarCompactCode, topbarAnalysisCode, sidebarFooterPolishCode, testStartCopyCode]) => {'
          if old_then not in text:
              raise SystemExit('Lista do Promise.all não encontrada.')
          text = text.replace(old_then, new_then, 1)

          safe_anchor = '        const safeSidebarFooterPolishCode = sidebarFooterPolishCode.split(closingScript).join("<\\\\/scr" + "ipt>");'
          safe_replacement = safe_anchor + '\n        const safeTestStartCopyCode = testStartCopyCode.split(closingScript).join("<\\\\/scr" + "ipt>");'
          if safe_anchor not in text:
              raise SystemExit('Bloco seguro não encontrado.')
          text = text.replace(safe_anchor, safe_replacement, 1)

          script_anchor = '        const sidebarFooterPolishScript = "<scr" + "ipt>" + safeSidebarFooterPolishCode + closingScript;'
          script_replacement = script_anchor + '\n        const testStartCopyScript = "<scr" + "ipt>" + safeTestStartCopyCode + closingScript;'
          if script_anchor not in text:
              raise SystemExit('Criação do script não encontrada.')
          text = text.replace(script_anchor, script_replacement, 1)

          concat_anchor = ' + topbarAnalysisScript + sidebarFooterPolishScript;'
          if concat_anchor not in text:
              raise SystemExit('Concatenação não encontrada.')
          text = text.replace(concat_anchor, ' + topbarAnalysisScript + sidebarFooterPolishScript + testStartCopyScript;', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/load-test-start-copy.yml
          git commit -m "Carrega correção do texto do teste rápido"
          git push
