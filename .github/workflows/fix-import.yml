name: Corrigir importação do Fixa

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-import.yml

permissions:
  contents: write

jobs:
  corrigir-importacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'    function importCards\(cards, fallbackSubject\) \{.*?\n    \}\n\n\n\n    function imageMimeFromName',
              re.DOTALL,
          )

          replacement = '''    function importCards(cards) {
            const targetId = el.importCollection?.value || data.selected;
            const targetSubject = data.subjects.find(subject => subject.id === targetId);

            if (!targetSubject) {
              setMessage(el.importMessage, "Selecione uma coleção de destino antes de importar.", "error");
              return 0;
            }

            const validCards = cards.filter(Boolean).map(card => {
              delete card.subject;
              return card;
            });

            if (!validCards.length) {
              setMessage(el.importMessage, "Não encontrei questões válidas para importar.", "error");
              return 0;
            }

            targetSubject.cards.push(...validCards);
            data.selected = targetSubject.id;
            return validCards.length;
          }



          function imageMimeFromName'''

          content, replacements = pattern.subn(replacement, content, count=1)
          if replacements != 1:
              raise SystemExit(f"Não foi possível localizar importCards; substituições: {replacements}")

          old_call = 'const total = importCards(imported, currentSubject()?.name || "");'
          new_call = 'const total = importCards(imported);'
          if old_call not in content:
              raise SystemExit("Não foi possível localizar a chamada antiga de importCards.")
          content = content.replace(old_call, new_call, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Validar a correção
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          assert "function importCards(cards)" in text
          assert "const total = importCards(imported);" in text
          print("Correção validada.")
          PY

      - name: Salvar correção e remover fluxo temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-import.yml
          git commit -m "Corrige importação para coleção selecionada"
          git push
