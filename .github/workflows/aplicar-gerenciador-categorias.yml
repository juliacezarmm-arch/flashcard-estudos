              if n != 1:
                  raise SystemExit(f"Falha ao substituir gerenciador: {n}")

              event_code = r'''  document.addEventListener("input", event => {
    if (event.target.matches?.("#categoryManagerSearch")) applyCategoryManagerSearch();
  });

  document.addEventListener("keydown", event => {
    if (event.target.matches?.("#newCategoryInput") && event.key === "Enter") {
      event.preventDefault();
      createCategoryFromManager();
    }
    if (event.target.matches?.(".category-rename-input")) {
      if (event.key === "Enter") {
        event.preventDefault();
        saveCategoryRename(event.target.closest("[data-category-row]"));
      } else if (event.key === "Escape") {
        event.preventDefault();
        const subject = categoryManagerSubject();
        if (subject) openCategoryManager(subject.id, { search: categorySearchTerm });
      }
    }
  });

  document.addEventListener("dragstart", event => {
    const row = event.target.closest?.("[data-category-row]");
    if (!row || !event.target.closest?.("#categoryManagerList")) return;
    draggedCategoryName = cleanCategoryName(row.dataset.categoryName);
    row.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", draggedCategoryName);
  });

  document.addEventListener("dragover", categoryDragOver);

  document.addEventListener("drop", event => {
    if (!event.target.closest?.("#categoryManagerList") || !draggedCategoryName) return;
    event.preventDefault();
    persistCategoryOrder();
  });

  document.addEventListener("dragend", event => {
    event.target.closest?.("[data-category-row]")?.classList.remove("dragging");
    if (draggedCategoryName) persistCategoryOrder();
    draggedCategoryName = "";
  });

  document.addEventListener("click", event => {
    const categoryAction = event.target.closest?.('[data-subject-action="categories"]');
    if (categoryAction) {
      const menu = categoryAction.closest(".sidebar-menu");
      const subjectId = menu?.dataset.menuId || openSidebarMenu?.id || "";
      openCategoryManager(subjectId);
      return;
    }

    if (event.target.closest?.("[data-category-new]")) {
      showNewCategoryPanel();
      return;
    }

    if (event.target.closest?.("[data-category-new-cancel]")) {
      hideNewCategoryPanel();
      return;
    }

    if (event.target.closest?.("[data-category-create]")) {
      createCategoryFromManager();
      return;
    }

    const moreButton = event.target.closest?.("[data-category-more]");
    if (moreButton) {
      const menu = moreButton.parentElement?.querySelector(".category-row-menu");
      const willOpen = Boolean(menu?.hidden);
      closeCategoryRowMenus(menu);
      if (menu) menu.hidden = !willOpen;
      moreButton.setAttribute("aria-expanded", String(willOpen));
      return;
    }

    const renameButton = event.target.closest?.("[data-category-rename]");
    if (renameButton) {
      startCategoryRename(renameButton.closest("[data-category-row]"));
      return;
    }

    const renameSave = event.target.closest?.("[data-category-rename-save]");
    if (renameSave) {
      saveCategoryRename(renameSave.closest("[data-category-row]"));
      return;
    }

    const renameCancel = event.target.closest?.("[data-category-rename-cancel]");
    if (renameCancel) {
      const subject = categoryManagerSubject();
      if (subject) openCategoryManager(subject.id, { search: categorySearchTerm });
      return;
    }

    const deleteButton = event.target.closest?.("[data-category-delete]");
    if (deleteButton) {
      deleteCategoryFromManager(deleteButton.closest("[data-category-row]"));
      return;
    }

    if (!event.target.closest?.(".category-row-actions")) closeCategoryRowMenus();
  });

