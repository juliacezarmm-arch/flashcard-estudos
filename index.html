<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixa</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}
    .loading{display:grid;gap:12px;text-align:center}
    .spinner{width:34px;height:34px;margin:auto;border:4px solid #dbe7ff;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><span class="spinner" aria-hidden="true"></span><strong>Carregando o Fixa...</strong></div>
  <script>
    const FIXA_VERSION = "20260807-competition-position-card-v1";
    const appFiles = [
      ["html", "index-base.html", "Não foi possível carregar a aplicação."],
      ["collections", "collections.js", "Não foi possível carregar as coleções."],
      ["questions", "questions-ui.js", "Não foi possível carregar os ajustes das questões."],
      ["importReview", "import-review.js", "Não foi possível carregar a revisão de importação."],
      ["analysis", "analysis-ui.js", "Não foi possível carregar a análise."],
      ["layout", "layout-ui.js", "Não foi possível carregar o layout."],
      ["collectionsOverlayStyle", "collections-overlay-style.js", "Não foi possível carregar o estilo do menu de coleções."],
      ["collectionsOverlayMenu", "collections-overlay-menu.js", "Não foi possível carregar o menu de coleções."],
      ["collectionsOverlayOutsideClick", "collections-overlay-outside-click.js", "Não foi possível carregar o fechamento do menu de coleções."],
      ["topbarHomeAlignment", "topbar-home-alignment.js", "Não foi possível alinhar o cabeçalho da página inicial."],
      ["hotfix", "hotfix-home-encoding.js", "Não foi possível carregar a correção de textos."],
      ["progressFix", "progress-objectives-summary-fix.js", "Não foi possível carregar os ajustes do progresso."],
      ["secondaryTabsLayoutFix", "secondary-tabs-layout-fix.js", "Não foi possível carregar o ajuste das abas secundárias."],
      ["secondaryContentSpacingV1", "secondary-content-spacing-v1.js", "Não foi possível ajustar o espaçamento entre as abas secundárias e o conteúdo."],
      ["addSpacingFix", "add-spacing-fix.js", "Não foi possível carregar a correção de espaçamento."],
      ["addButtonsStyle", "add-buttons-style.js", "Não foi possível carregar o estilo dos botões de Adicionar."],
      ["sequenceVisualFix", "sequence-visual-fix.js", "Não foi possível carregar o ajuste visual da sequência."],
      ["reviewQuestionsUi", "review-questions-ui.js", "Não foi possível carregar a interface de revisão de questões."],
      ["questionsHub", "questions-hub.js", "Não foi possível unificar Questões e Adicionar."],
      ["authLoginRecovery", "auth-login-recovery.js", "Não foi possível carregar o reforço do login."],
      ["dexBottomScrollFix", "dex-bottom-scroll-fix.js", "Não foi possível carregar a correção de rolagem do DeX."],
      ["storageImageLazyLoad", "storage-image-lazy-load.js", "Não foi possível carregar as imagens sob demanda."],
      ["reviewStorageUpload", "review-storage-upload.js", "Não foi possível carregar o envio das imagens ao Storage."],
      ["collectionOpenQuestions", "collection-open-questions.js", "Não foi possível carregar a navegação das coleções."],
      ["questionsHeightFix", "questions-height-fix.js", "Não foi possível carregar o ajuste de altura das questões."],
      ["competitionUi", "competition-ui-v2.js", "Não foi possível carregar a área de competição."],
      ["competitionUpdateV3", "competition-update-v3.js", "Não foi possível carregar a atualização da competição."],
      ["competitionSecondaryTabsPlacement", "competition-secondary-tabs-placement.js", "Não foi possível posicionar as ações secundárias da competição."],
      ["competitionPolishV6", "competition-polish-v6.js", "Não foi possível refinar a interface da competição."],
      ["competitionActiveFlowV1", "competition-active-flow-v1.js", "Não foi possível ajustar o fluxo das competições ativas."],
      ["competitionManagerV7", "competition-manager-v7.js", "Não foi possível carregar Minhas competições."],
      ["competitionColorsInviteV8", "competition-colors-invite-v8.js", "Não foi possível carregar as cores e o convite da competição."],
      ["competitionPositionCardV1", "competition-position-card-v1.js", "Não foi possível refinar o cartão Minha posição."],
      ["competitionXpHomeV4", "competition-xp-home-v4.js", "Não foi possível concluir a integração de XP."],
      ["accountDataIsolation", "account-data-isolation.js", "Não foi possível isolar os dados desta conta."],
      ["homeEmptyStates", "home-empty-state-illustrations.js", "Não foi possível carregar as ilustrações da página inicial."],
      ["collectionsMenuActions", "collections-menu-actions.js", "Não foi possível carregar as ações dos menus de coleções."],
      ["collectionsFloatingMenuFix", "collections-floating-menu-fix.js", "Não foi possível restaurar o menu flutuante das coleções."],
      ["homeArtCompetitionFix", "home-art-and-competition-icon-fix.js", "Não foi possível ajustar as imagens e o ícone de competição."],
      ["homeTodayPolishNoScroll", "home-today-polish-no-scroll.js", "Não foi possível refinar a tela Hoje."],
      ["homeEmptyStateArt", "home-empty-state-art.js", "Não foi possível carregar os novos estados visuais da página inicial."]
    ];

    function loadFile([key, file, message]) {
      return fetch(`${file}?v=${FIXA_VERSION}`, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error(message);
        return response.text().then(text => [key, text]);
      });
    }

    Promise.all(appFiles.map(loadFile))
      .then(entries => {
        const assets = Object.fromEntries(entries);
        const closingScript = "</scr" + "ipt>";
        const scriptFiles = ["collections", "questions", "importReview", "analysis", "layout", "collectionsOverlayStyle", "collectionsOverlayMenu", "collectionsOverlayOutsideClick", "topbarHomeAlignment", "hotfix", "progressFix", "secondaryTabsLayoutFix", "secondaryContentSpacingV1", "addSpacingFix", "addButtonsStyle", "sequenceVisualFix", "reviewQuestionsUi", "questionsHub", "authLoginRecovery", "dexBottomScrollFix", "storageImageLazyLoad", "reviewStorageUpload", "collectionOpenQuestions", "questionsHeightFix", "competitionUi", "competitionUpdateV3", "competitionSecondaryTabsPlacement", "competitionPolishV6", "competitionActiveFlowV1", "competitionManagerV7", "competitionColorsInviteV8", "competitionPositionCardV1", "competitionXpHomeV4", "accountDataIsolation", "homeEmptyStates", "collectionsMenuActions", "collectionsFloatingMenuFix", "homeArtCompetitionFix", "homeTodayPolishNoScroll", "homeEmptyStateArt"];
        const scripts = scriptFiles.map(key => {
          let safeCode = assets[key];

          if (key === "layout") {
            safeCode = safeCode.replace(
              "  const studyArt = homeView.querySelector('.home-study-head .home-icon');\n   if (studyArt) {\n    const image = document.createElement('img');\n    image.className = 'home-study-art';\n    image.src = homeAsset(HOME_ASSETS.clipboard);\n    image.alt = 'Prancheta com tarefas de estudo';\n     studyArt.replaceWith(image);\n   }",
              "  const studyArt = homeView.querySelector('.home-study-head .home-icon');\n  if (studyArt) studyArt.remove();"
            );
          }

          if (key === "competitionUpdateV3") {
            safeCode = safeCode.replace(
              "const uid = () => window.currentUser?.id || null;",
              "const uid = () => window.currentUser?.id || (typeof currentUser !== 'undefined' ? currentUser?.id : null) || null;"
            );
            safeCode = safeCode.replace(
              "async function load(){if(!uid()||!sb())return;root.innerHTML=",
              "async function load(){if(!sb()){root.innerHTML=head()+'<div class=\"cv3-card\"><h3>Não foi possível conectar ao servidor</h3><p class=\"cv3-muted\">Atualize a página e tente novamente.</p></div>';bind();return;}root.innerHTML="
            );
          }

          if (key === "reviewStorageUpload") {
            safeCode = safeCode.replace(
              "function resolveStorageImage(img) {\n    const source = img.getAttribute('src') || '';",
              "function resolveStorageImage(img) {\n    if (window.FixaStorageLazyLoader?.observe) {\n      window.FixaStorageLazyLoader.observe(img);\n      return;\n    }\n    const source = img.getAttribute('src') || '';"
            );
          }

          safeCode = safeCode.split(closingScript).join("<\\/scr" + "ipt>");
          return "<scr" + "ipt>" + safeCode + closingScript;
        }).join("");

        const faviconTag = '<link rel="icon" type="image/svg+xml" href="./favicon.svg">';
        const htmlWithFavicon = assets.html.includes("</head>")
          ? assets.html.replace("</head>", faviconTag + "</head>")
          : faviconTag + assets.html;
        const completeHtml = htmlWithFavicon.includes("</body>")
          ? htmlWithFavicon.replace("</body>", scripts + "</body>")
          : htmlWithFavicon + scripts;
        document.open();
        document.write(completeHtml);
        document.close();
      })
      .catch(error => {
        console.error("[Fixa] Falha ao carregar:", error);
        document.body.innerHTML = '<div class="loading"><strong>Não foi possível carregar o Fixa.</strong><span>Atualize a página e tente novamente.</span></div>';
      });
  </script>
</body>
</html>
