<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixa</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}
    .loading{display:grid;gap:12px;text-align:center}
    .spinner{width:34px;height:34px;margin:auto;border:4px solid #dbe7ff;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><span class="spinner" aria-hidden="true"></span><strong>Carregando o Fixa...</strong></div>
  <script>
    Promise.all([
      fetch("index-base.html?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a aplicação.");
        return response.text();
      }),
      fetch("categories.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar as categorias.");
        return response.text();
      }),
      fetch("categories-manager-ui.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o gerenciador de categorias.");
        return response.text();
      }),
      fetch("compact-questions.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o estilo compacto das questões.");
        return response.text();
      }),
      fetch("import-review.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a revisão de importação.");
        return response.text();
      }),
      fetch("category-modal-close-fix.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a correção do gerenciador de categorias.");
        return response.text();
      }),
      fetch("import-review-compact.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o resumo das pendências.");
        return response.text();
      }),
      fetch("collection-order-manager.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o gerenciador de ordem das coleções.");
        return response.text();
      }),
      fetch("import-review-replace-exact.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a substituição das repetidas exatas.");
        return response.text();
      }),
      fetch("analysis-compact.css.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar os ajustes da análise.");
        return response.text();
      }),
      fetch("analysis-percent-alignment.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o alinhamento das porcentagens.");
        return response.text();
      }),
      fetch("topbar-compact.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar o cabeçalho compacto.");
        return response.text();
      }),
      fetch("topbar-analysis.js?v=20260731-topbar-analysis-1", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Não foi possível carregar a navegação da análise.");
        return response.text();
      })
    ])
      .then(([html, categoryCode, categoryManagerCode, compactQuestionsCode, importReviewCode, categoryModalCloseFixCode, importReviewCompactCode, collectionOrderManagerCode, importReviewReplaceExactCode, analysisCompactCode, analysisPercentAlignmentCode, topbarCompactCode, topbarAnalysisCode]) => {
        const closingScript = "</scr" + "ipt>";
        const safeCategoryCode = categoryCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeCategoryManagerCode = categoryManagerCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeCompactQuestionsCode = compactQuestionsCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeImportReviewCode = importReviewCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeCategoryModalCloseFixCode = categoryModalCloseFixCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeImportReviewCompactCode = importReviewCompactCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeCollectionOrderManagerCode = collectionOrderManagerCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeImportReviewReplaceExactCode = importReviewReplaceExactCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeAnalysisCompactCode = analysisCompactCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeAnalysisPercentAlignmentCode = analysisPercentAlignmentCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeTopbarCompactCode = topbarCompactCode.split(closingScript).join("<\\/scr" + "ipt>");
        const safeTopbarAnalysisCode = topbarAnalysisCode.split(closingScript).join("<\\/scr" + "ipt>");
        const categoryScript = "<scr" + "ipt>" + safeCategoryCode + closingScript;
        const categoryManagerScript = "<scr" + "ipt>" + safeCategoryManagerCode + closingScript;
        const compactQuestionsScript = "<scr" + "ipt>" + safeCompactQuestionsCode + closingScript;
        const importReviewScript = "<scr" + "ipt>" + safeImportReviewCode + closingScript;
        const categoryModalCloseFixScript = "<scr" + "ipt>" + safeCategoryModalCloseFixCode + closingScript;
        const importReviewCompactScript = "<scr" + "ipt>" + safeImportReviewCompactCode + closingScript;
        const collectionOrderManagerScript = "<scr" + "ipt>" + safeCollectionOrderManagerCode + closingScript;
        const importReviewReplaceExactScript = "<scr" + "ipt>" + safeImportReviewReplaceExactCode + closingScript;
        const analysisCompactScript = "<scr" + "ipt>" + safeAnalysisCompactCode + closingScript;
        const analysisPercentAlignmentScript = "<scr" + "ipt>" + safeAnalysisPercentAlignmentCode + closingScript;
        const topbarCompactScript = "<scr" + "ipt>" + safeTopbarCompactCode + closingScript;
        const topbarAnalysisScript = "<scr" + "ipt>" + safeTopbarAnalysisCode + closingScript;
        const scripts = categoryScript + categoryManagerScript + compactQuestionsScript + importReviewScript + categoryModalCloseFixScript + importReviewCompactScript + collectionOrderManagerScript + importReviewReplaceExactScript + analysisCompactScript + analysisPercentAlignmentScript + topbarCompactScript + topbarAnalysisScript;
        const faviconTag = '<link rel="icon" type="image/svg+xml" href="./favicon.svg">';
        const htmlWithFavicon = html.includes("</head>")
          ? html.replace("</head>", faviconTag + "</head>")
          : faviconTag + html;
        const completeHtml = htmlWithFavicon.includes("</body>")
          ? htmlWithFavicon.replace("</body>", scripts + "</body>")
          : htmlWithFavicon + scripts;
        document.open();
        document.write(completeHtml);
        document.close();
      })
      .catch(error => {
        console.error("[Fixa] Falha ao carregar:", error);
        document.body.innerHTML = '<div class="loading"><strong>Não foi possível carregar o Fixa.</strong><span>Atualize a página e tente novamente.</span></div>';
      });
  </script>
</body>
</html>
