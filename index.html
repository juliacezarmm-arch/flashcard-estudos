<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixa</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}
    .loading{display:grid;gap:12px;text-align:center}
    .spinner{width:34px;height:34px;margin:auto;border:4px solid #dbe7ff;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><span class="spinner" aria-hidden="true"></span><strong>Carregando o Fixa...</strong></div>
  <script>
    const FIXA_VERSION = "20260803-company-browser-recovery-1";
    const LOCAL_STORE_KEY = "flashcard-estudos-v2";

    /* Compatibilidade para navegadores corporativos desatualizados. */
    if (typeof window.structuredClone !== "function") {
      window.structuredClone = value => JSON.parse(JSON.stringify(value));
    }

    /* Um dado local incompleto pode interromper todo o JavaScript antes do login. */
    try {
      const savedLocalData = localStorage.getItem(LOCAL_STORE_KEY);
      if (savedLocalData) JSON.parse(savedLocalData);
    } catch (error) {
      console.warn("[Fixa] Dados locais inválidos foram descartados. Os dados online permanecem no Supabase.", error);
      localStorage.removeItem(LOCAL_STORE_KEY);
    }

    function showBootError(message) {
      setTimeout(() => {
        const notice = document.querySelector("#authNotice");
        if (notice) {
          notice.textContent = message;
          notice.classList.add("show", "error");
          return;
        }
        const loading = document.querySelector(".loading");
        if (loading) loading.innerHTML = `<strong>Não foi possível iniciar o Fixa.</strong><span>${message}</span>`;
      }, 0);
    }

    window.addEventListener("error", event => {
      console.error("[Fixa] Erro de inicialização:", event.error || event.message);
      showBootError("Este navegador interrompeu o carregamento do aplicativo. Atualize o navegador ou abra o Fixa em uma janela anônima.");
    });

    window.addEventListener("unhandledrejection", event => {
      console.error("[Fixa] Falha não tratada:", event.reason);
      showBootError("Não foi possível concluir a conexão. Atualize a página e tente novamente.");
    });

    const appFiles = [
      ["html", "index-base.html", "Não foi possível carregar a aplicação."],
      ["collections", "collections.js", "Não foi possível carregar as coleções."],
      ["questions", "questions-ui.js", "Não foi possível carregar os ajustes das questões."],
      ["importReview", "import-review.js", "Não foi possível carregar a revisão de importação."],
      ["analysis", "analysis-ui.js", "Não foi possível carregar a análise."],
      ["layout", "layout-ui.js", "Não foi possível carregar o layout."],
      ["hotfix", "hotfix-home-encoding.js", "Não foi possível carregar a correção de textos."],
      ["progressFix", "progress-objectives-summary-fix.js", "Não foi possível carregar os ajustes do progresso."]
    ];

    function loadFile([key, file, message]) {
      return fetch(`${file}?v=${FIXA_VERSION}`, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error(message);
        return response.text().then(text => [key, text]);
      });
    }

    Promise.all(appFiles.map(loadFile))
      .then(entries => {
        const assets = Object.fromEntries(entries);
        const closingScript = "</scr" + "ipt>";
        const scriptFiles = ["collections", "questions", "importReview", "analysis", "layout", "hotfix", "progressFix"];
        const scripts = scriptFiles.map(key => {
          const safeCode = assets[key].split(closingScript).join("<\\/scr" + "ipt>");
          return "<scr" + "ipt>" + safeCode + closingScript;
        }).join("");
        const faviconTag = '<link rel="icon" type="image/svg+xml" href="./favicon.svg">';
        const htmlWithFavicon = assets.html.includes("</head>")
          ? assets.html.replace("</head>", faviconTag + "</head>")
          : faviconTag + assets.html;
        const completeHtml = htmlWithFavicon.includes("</body>")
          ? htmlWithFavicon.replace("</body>", scripts + "</body>")
          : htmlWithFavicon + scripts;
        document.open();
        document.write(completeHtml);
        document.close();
      })
      .catch(error => {
        console.error("[Fixa] Falha ao carregar:", error);
        document.body.innerHTML = `<div class="loading"><strong>Não foi possível carregar o Fixa.</strong><span>${error.message || "Atualize a página e tente novamente."}</span></div>`;
      });
  </script>
</body>
</html>
