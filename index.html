<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixa</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f7fb}
    .loading{display:grid;gap:12px;text-align:center}
    .spinner{width:34px;height:34px;margin:auto;border:4px solid #dbe7ff;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><span class="spinner" aria-hidden="true"></span><strong>Carregando o Fixa...</strong></div>
  <script>
    const FIXA_VERSION = "20260822-home-stability-v2";
    const appFiles = [
      ["html", "index-base.html", "Não foi possível carregar a aplicação."],
      ["collections", "src/core/collections.js", "Não foi possível carregar as coleções."],
      ["questions", "src/core/questions-ui.js", "Não foi possível carregar os ajustes das questões."],
      ["importReview", "src/core/import-review.js", "Não foi possível carregar a revisão de importação."],
      ["analysis", "src/core/analysis-ui.js", "Não foi possível carregar a análise."],
      ["layout", "src/core/layout-ui.js", "Não foi possível carregar o layout."],
      ["testFolder", "src/test/test-folder.js", "Não foi possível carregar o Teste pasta."],
      ["collectionsOverlayStyle", "src/collections-menu/collections-overlay-style.js", "Não foi possível carregar o estilo do menu de coleções."],
      ["collectionsOverlayMenu", "src/collections-menu/collections-overlay-menu.js", "Não foi possível carregar o menu de coleções."],
      ["collectionsOverlayOutsideClick", "src/collections-menu/collections-overlay-outside-click.js", "Não foi possível carregar o fechamento do menu de coleções."],
      ["topbarHomeAlignment", "src/fixes/topbar-home-alignment.js", "Não foi possível alinhar o cabeçalho da página inicial."],
      ["hotfix", "src/fixes/hotfix-home-encoding.js", "Não foi possível carregar a correção de textos."],
      ["secondaryTabsLayoutFix", "src/fixes/secondary-tabs-layout-fix.js", "Não foi possível carregar o ajuste das abas secundárias."],
      ["secondaryContentSpacingV1", "src/fixes/secondary-content-spacing-v1.js", "Não foi possível ajustar o espaçamento entre as abas secundárias e o conteúdo."],
      ["addSpacingFix", "src/fixes/add-spacing-fix.js", "Não foi possível carregar a correção de espaçamento."],
      ["addButtonsStyle", "src/fixes/add-buttons-style.js", "Não foi possível carregar o estilo dos botões de Adicionar."],
      ["sequenceVisualFix", "src/fixes/sequence-visual-fix.js", "Não foi possível carregar o ajuste visual da sequência."],
      ["reviewQuestionsUi", "src/core/review-questions-ui.js", "Não foi possível carregar a interface de revisão de questões."],
      ["questionsHub", "src/core/questions-hub.js", "Não foi possível unificar Questões e Adicionar."],
      ["authLoginRecovery", "src/auth/auth-login-recovery.js", "Não foi possível carregar o reforço do login."],
      ["dexBottomScrollFix", "src/fixes/dex-bottom-scroll-fix.js", "Não foi possível carregar a correção de rolagem do DeX."],
      ["storageImageLazyLoad", "src/storage/storage-image-lazy-load.js", "Não foi possível carregar as imagens sob demanda."],
      ["reviewStorageUpload", "src/storage/review-storage-upload.js", "Não foi possível carregar o envio das imagens ao Storage."],
      ["collectionOpenQuestions", "src/core/collection-open-questions.js", "Não foi possível carregar a navegação das coleções."],
      ["questionsHeightFix", "src/fixes/questions-height-fix.js", "Não foi possível carregar o ajuste de altura das questões."],
      ["competitionUpdateV3", "src/competition/competition-update-v3.js", "Não foi possível carregar a atualização da competição."],
      ["competitionSecondaryTabsPlacement", "src/competition/competition-secondary-tabs-placement.js", "Não foi possível posicionar as ações secundárias da competição."],
      ["competitionPolishV6", "src/competition/competition-polish-v6.js", "Não foi possível refinar a interface da competição."],
      ["competitionActiveFlowV1", "src/competition/competition-active-flow-v1.js", "Não foi possível ajustar o fluxo das competições ativas."],
      ["competitionManagerV7", "src/competition/competition-manager-v7.js", "Não foi possível carregar Minhas competições."],
      ["competitionPositionCardV1", "src/competition/competition-position-card-v1.js", "Não foi possível refinar o cartão Minha posição."],
      ["competitionLayoutBalanceV1", "src/competition/competition-layout-balance-v1.js", "Não foi possível alinhar os cartões da competição."],
      ["competitionInvitationsV9", "src/competition/competition-invitations-v9.js", "Não foi possível carregar os convites da competição."],
      ["competitionXpHomeV4", "src/competition/competition-xp-home-v4.js", "Não foi possível concluir a integração de XP."],
      ["accountDataIsolation", "src/auth/account-data-isolation.js", "Não foi possível isolar os dados desta conta."],
      ["collectionsMenuActions", "src/collections-menu/collections-menu-actions.js", "Não foi possível carregar as ações dos menus de coleções."],
      ["collectionsFloatingMenuFix", "src/collections-menu/collections-floating-menu-fix.js", "Não foi possível restaurar o menu flutuante das coleções."],
      ["homeTodayPolishNoScroll", "src/fixes/home-today-polish-no-scroll.js", "Não foi possível carregar a estrutura da página inicial."],
      ["homeUnifiedDashboardV2", "src/fixes/home-unified-dashboard-v2.js", "Não foi possível carregar a página inicial consolidada."],
      ["homeGoalsStreakProtectionV1", "src/fixes/home-goals-streak-protection-v1.js", "Não foi possível carregar XP e proteção da página inicial."],
      ["homeArtCompetitionFix", "src/fixes/home-art-and-competition-icon-fix.js", "Não foi possível ajustar o cabeçalho e o ícone de competição."],
      ["homeEmptyStateArt", "src/fixes/home-empty-state-art.js", "Não foi possível carregar os estados auxiliares da página inicial."]
    ];

    function loadFile([key, file, message]) {
      return fetch(`${file}?v=${FIXA_VERSION}`, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error(message);
        return response.text().then(text => [key, text]);
      });
    }

    Promise.all(appFiles.map(loadFile))
      .then(entries => {
        const assets = Object.fromEntries(entries);
        assets.html = assets.html.replace(
          "A imagem deve conter somente a figura necessária, sem respostas, correções, marcações ou gabarito.</textarea>",
          `A imagem deve conter somente a figura necessária, sem respostas, correções, marcações ou gabarito.

IMAGENS NA EXPLICAÇÃO
- Quando a explicação possuir uma ou mais imagens necessárias para compreender a resolução, informar essas imagens no campo explanationImages.
- explanationImages deve ser uma lista e pode conter uma ou várias imagens, sempre na mesma ordem em que aparecem no material de origem.
- O campo image continua reservado exclusivamente para a imagem do enunciado/pergunta.
- Não misturar imagens do enunciado com imagens da explicação.
- As alternativas (options) continuam somente em texto; não criar imagens nas alternativas por enquanto.
- Se a explicação não possuir imagem, omitir explanationImages ou usar uma lista vazia.
- Cada imagem explicativa deve conter apenas o conteúdo necessário da explicação, sem adicionar gabarito, resposta, seta, destaque ou marcação que não exista no material original.
- No Fixa, cada imagem da explicação será exibida em uma linha própria e sempre centralizada.
- Ao preparar um ZIP, incluir também todos os arquivos citados em explanationImages junto com o JSON e as demais imagens da questão.</textarea>`
        );
        const closingScript = "</scr" + "ipt>";
        const scriptFiles = ["collections", "questions", "importReview", "analysis", "layout", "testFolder", "collectionsOverlayStyle", "collectionsOverlayMenu", "collectionsOverlayOutsideClick", "topbarHomeAlignment", "hotfix", "secondaryTabsLayoutFix", "secondaryContentSpacingV1", "addSpacingFix", "addButtonsStyle", "sequenceVisualFix", "reviewQuestionsUi", "questionsHub", "authLoginRecovery", "dexBottomScrollFix", "storageImageLazyLoad", "reviewStorageUpload", "collectionOpenQuestions", "questionsHeightFix", "competitionUpdateV3", "competitionSecondaryTabsPlacement", "competitionPolishV6", "competitionActiveFlowV1", "competitionManagerV7", "competitionPositionCardV1", "competitionLayoutBalanceV1", "competitionInvitationsV9", "accountDataIsolation", "competitionXpHomeV4", "collectionsMenuActions", "collectionsFloatingMenuFix", "homeTodayPolishNoScroll", "homeUnifiedDashboardV2", "homeGoalsStreakProtectionV1", "homeArtCompetitionFix", "homeEmptyStateArt"];
        const scripts = scriptFiles.map(key => {
          let safeCode = assets[key];

          if (key === "layout") {
            safeCode = safeCode.replace(
              "  const studyArt = homeView.querySelector('.home-study-head .home-icon');\n   if (studyArt) {\n    const image = document.createElement('img');\n    image.className = 'home-study-art';\n    image.src = homeAsset(HOME_ASSETS.clipboard);\n    image.alt = 'Prancheta com tarefas de estudo';\n     studyArt.replaceWith(image);\n   }",
              "  const studyArt = homeView.querySelector('.home-study-head .home-icon');\n  if (studyArt) studyArt.remove();"
            );
            safeCode = safeCode.replace(
              "   function renderHome() {\n",
              "   function renderHome() {\n     if (window.FixaHomeWeeklyDashboardV2?.refresh) {\n       window.FixaHomeWeeklyDashboardV2.refresh();\n       return;\n     }\n"
            );
          }

          if (key === "competitionUpdateV3") {
            safeCode = safeCode.replace(
              "const uid = () => window.currentUser?.id || null;",
              "const uid = () => window.currentUser?.id || (typeof currentUser !== 'undefined' ? currentUser?.id : null) || null;"
            );
            safeCode = safeCode.replace(
              "async function load(){if(!uid()||!sb())return;root.innerHTML=",
              "async function load(){if(!sb()){root.innerHTML=head()+'<div class=\"cv3-card\"><h3>Não foi possível conectar ao servidor</h3><p class=\"cv3-muted\">Atualize a página e tente novamente.</p></div>';bind();return;}root.innerHTML="
            );
          }

          if (key === "competitionXpHomeV4") {
            safeCode = safeCode.replace(
              "  function renderXpUi() {\n    ensureHomeXpCard();\n    renderCollectionXp();\n    renderHistoryXp();\n  }",
              "  function renderXpUi() {\n    renderHistoryXp();\n    window.FixaHomeWeeklyDashboardV2?.refresh?.();\n  }"
            );
            safeCode = safeCode.replace(
              "  const observer = new MutationObserver(() => queueRenderXpUi(300));\n  observer.observe(document.body || document.documentElement, { childList: true, subtree: true });\n",
              ""
            );
            safeCode = safeCode.replace(
              "  setInterval(() => {\n    if (!document.hidden) syncAll(false);\n  }, 60000);\n",
              ""
            );
          }

          if (key === "reviewStorageUpload") {
            safeCode = safeCode.replace(
              "function resolveStorageImage(img) {\n    const source = img.getAttribute('src') || '';",
              "function resolveStorageImage(img) {\n    if (window.FixaStorageLazyLoader?.observe) {\n      window.FixaStorageLazyLoader.observe(img);\n      return;\n    }\n    const source = img.getAttribute('src') || '';"
            );
          }

          if (key === "homeEmptyStateArt") {
            safeCode = safeCode.replace(
              "(() => {\n  const STYLE_ID = 'homeEmptyStateArtStyle';",
              "(() => {\n  if (window.FixaHomeWeeklyDashboardV2) return;\n  const STYLE_ID = 'homeEmptyStateArtStyle';"
            );
          }

          safeCode = safeCode.split(closingScript).join("<\\/scr" + "ipt>");
          return "<scr" + "ipt>" + safeCode + closingScript;
        }).join("");

        const faviconTag = '<link rel="icon" type="image/svg+xml" href="./favicon.svg">';
        const htmlWithFavicon = assets.html.includes("</head>")
          ? assets.html.replace("</head>", faviconTag + "</head>")
          : faviconTag + assets.html;
        const completeHtml = htmlWithFavicon.includes("</body>")
          ? htmlWithFavicon.replace("</body>", scripts + "</body>")
          : htmlWithFavicon + scripts;
        document.open();
        document.write(completeHtml);
        document.close();
      })
      .catch(error => {
        console.error("[Fixa] Falha ao carregar:", error);
        document.body.innerHTML = '<div class="loading"><strong>Não foi possível carregar o Fixa.</strong><span>Atualize a página e tente novamente.</span></div>';
      });
  </script>
</body>
</html>
